    function formatDate(dateStr) {
        if (!dateStr) return '';
        try {
            const d = new Date(dateStr);
            const now = new Date();
            const diff = Math.floor((now - d) / 1000);
            if (diff < 60) return 'עכשיו';
            if (diff < 3600) return 'לפני ' + Math.floor(diff/60) + ' דקות';
            if (diff < 7200) return 'לפני שעה';
            if (diff < 86400) return 'לפני ' + Math.floor(diff/3600) + ' שעות';
            if (diff < 172800) return 'אתמול';
            if (diff < 604800) return 'לפני ' + Math.floor(diff/86400) + ' ימים';
            return d.toLocaleDateString('he-IL', { day:'2-digit', month:'2-digit' });
        } catch { return dateStr; }
    }

    function isToday(dateStr) {
        if (!dateStr) return false;
        try { return new Date(dateStr).toDateString() === new Date().toDateString(); } catch { return false; }

        if (!phone) return '';
        let p = phone.replace(/[^\d+]/g, '');

            });
        } catch(e) { console.error(e); }
    }

    async function saveLeadData(key, data) {
        try {
            const existing = leadStatuses[key] || { handled_by:'', status:'new', sub_status:null, interview_date:null, interview_time:null, hidden:false };
            const full = Object.assign({}, existing, data, { lead_key: key });
            await fetch(SUPABASE_URL + '/rest/v1/lead_statuses?on_conflict=lead_key', {
                method: 'POST',
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=minimal,resolution=merge-duplicates' },
                body: JSON.stringify(full)
            });
            if (!leadStatuses[key]) leadStatuses[key] = {};
            Object.assign(leadStatuses[key], full);
        } catch(e) { console.error(e); }
    }

        for (const row of response.table.rows) {
            const c = row.c||[];
            const name = cv(c,ni), phone = cv(c,pi).replace(/^p:/,'').trim();
            if (!name && !phone) continue;
            allLeads.push({ name, phone, job:cv(c,ji), date:cv(c,di), platform:cv(c,pli) });
        }
        allLeads.sort((a,b) => { try { return new Date(b.date)-new Date(a.date); } catch { return 0; } });
        allLeads = allLeads.filter(l => { try { return new Date(l.date) >= new Date('2026-03-01'); } catch { return false; } });
        updateStats(); renderCards();
        document.getElementById('lastUpdate').textContent = 'עדכון: ' + new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
    }

    function getLeadSort(info) {
        if (!info || (!info.handled_by && info.status === 'new')) return 0;
        if (info.status === 'meeting') return 1;
        if (info.status === 'not_relevant') return 3;
        return 2;
    }

    function updateStats() {
        const visible = allLeads.filter(l => { const info = leadStatuses[(l.name+'_'+l.phone).replace(/\s/g,'_')]; return !info||!info.hidden; });
        document.getElementById('totalLeads').textContent = visible.length;
        document.getElementById('todayLeads').textContent = visible.filter(l => isToday(l.date)).length;
        document.getElementById('igLeads').textContent = visible.filter(l => l.platform==='ig').length;
        document.getElementById('newLeads').textContent = visible.filter(l => { const info=leadStatuses[(l.name+'_'+l.phone).replace(/\s/g,'_')]; return !info||(!info.handled_by&&info.status==='new'); }).length;
        document.getElementById('meetingLeads').textContent = allLeads.filter(l => { const info=leadStatuses[(l.name+'_'+l.phone).replace(/\s/g,'_')]; return info&&info.status==='meeting'; }).length;
    }

    function setFilter(btn) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderCards();
    }

    function buildCard(lead) {
        const displayName = hebrewName(lead.name);
        const phoneFormatted = formatPhone(lead.phone);
        const phoneClean = lead.phone.replace(/[^\d+]/g,'');
        let waPhone = phoneClean;
        if (waPhone.startsWith('0')) waPhone = '972'+waPhone.slice(1);
        else if (waPhone.startsWith('+')) waPhone = waPhone.slice(1);
        const jobLabel = getJobLabel(lead.job);
        const waMsg = encodeURIComponent('היי '+displayName+' מה שלומך? ראיתי שהשארת פרטים בנוגע למשרת '+jobLabel+' בפסאו.');
        const lk = (lead.name+'_'+lead.phone).replace(/\s/g,'_');
        const info = leadStatuses[lk];
        const handledBy = info?.handled_by||'';
        const status = info?.status||'new';
        const isNotRelevant = status==='not_relevant';
        const isMeeting = status==='meeting';
        const plc = lead.platform==='ig'?'platform-ig':'platform-fb';
        const pll = lead.platform==='ig'?'IG':'FB';

        let html = '<div class="lead-card'+(isNotRelevant?' card-not-relevant':'')+'">';
        html += '<div class="lead-top"><div><span class="lead-name">'+escapeHtml(displayName)+'</span> <span class="lead-phone">'+phoneFormatted+'</span></div><div class="lead-meta"><span class="platform-badge '+plc+'">'+pll+'</span><span class="lead-date">'+formatDate(lead.date)+'</span></div></div>';
        html += '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span class="lead-job '+getJobClass(lead.job)+'">'+escapeHtml(lead.job)+'</span>';
        if (handledBy) { const hc=handledBy==='ירין'?'yarin':'adi'; html+='<span class="handler-badge '+hc+'">'+handledBy+'</span>'; }
        const subLabels = { sent:'📨 נשלחה הודעה', call:'📞 ניסיון התקשרות', replied:'💬 ענה/תה', no_ans:'🔇 אין מענה', later:'⏰ יחזור/תדחה מאוחר יותר', hired:'✅ התקבל/ה', cancel:'❌ ביטל/ה', confirm:'✅ אישר/ה הגעה', arrived:'🎉 הגיע/ה לריאיון' };
        const subColors = { sent:'#e3f2fd', call:'#fff3e0', replied:'#e8f5e9', no_ans:'#f5f5f5', later:'#f3e5f5', hired:'#c8e6c9', cancel:'#ffebee', confirm:'#e8f5e9', arrived:'#c8e6c9' };
        const curSub = info?.sub_status||null;
        if (curSub && subLabels[curSub]) html += '<span class="sub-status-badge" style="background:'+subColors[curSub]+'">'+subLabels[curSub]+'</span>';
        html += '</div>';
        html += '<div class="lead-actions"><a class="action-btn action-call" href="tel:'+phoneClean+'">📞 התקשר</a><a class="action-btn action-wa" href="https://wa.me/'+waPhone+'?text='+waMsg+'" target="_blank">💬 וואטסאפ</a></div>';

        if (!handledBy) {
            html += '<div class="handle-section"><div class="handle-label">מי מטפל בליד?</div><div class="handle-btns"><div class="handle-btn" onclick="setHandler(\''+lk+'\',\'ירין\')">ירין</div><div class="handle-btn" onclick="setHandler(\''+lk+'\',\'עדי\')">עדי</div></div></div>';
        } else if (status==='new') {
            const sub = info?.sub_status||null;
            const subBtns = [
                { val:'sent',    label:'📨 נשלחה הודעה',      cls:'sub-sent'    },
                { val:'call',    label:'📞 ניסיון התקשרות',   cls:'sub-call'    },
                { val:'replied', label:'💬 ענה/תה',           cls:'sub-replied' },
                { val:'no_ans',  label:'🔇 אין מענה',         cls:'sub-no-ans'  },
                { val:'later',   label:'⏰ יחזור מאוחר יותר', cls:'sub-later'   },
                { val:'hired',   label:'✅ התקבל/ה',          cls:'sub-hired'   },
            ].map(b => {
                const isActive = sub === b.val ? ' active-sub' : '';
                return '<div class="sub-btn '+b.cls+isActive+'" onclick="setSubStatus(\''+lk+'\',\''+b.val+'\')">'+b.label+'</div>';
            }).join('');
            html += '<div class="sub-status-section"><div class="sub-status-label">סטטוס טיפול</div><div class="sub-status-grid">'+subBtns+'</div></div>';
            html += '<div style="margin-top:8px"><div class="next-btns"><div class="next-btn btn-meeting" onclick="setMeetingStatus(\''+lk+'\')">📅 נקבע ריאיון</div><div class="next-btn btn-not-relevant" onclick="setNotRelevant(\''+lk+'\')">לא רלוונטי</div></div></div>';
        }

        if ((status==='new'||isMeeting) && openInterviewForms[lk]) {
            const ed=info?.interview_date||'', et=info?.interview_time?.slice(0,5)||'';
            html += '<div class="interview-inline"><label>תאריך ריאיון</label><input type="date" id="int-date-'+lk+'" value="'+ed+'"><label>שעה</label><input type="time" id="int-time-'+lk+'" value="'+et+'"><button class="int-save-btn" onclick="saveInterview(\''+lk+'\')">שמור ריאיון</button></div>';
        } else if (isMeeting && info?.interview_date) {
            html += '<div class="interview-info"><span>📅 '+formatInterview(info.interview_date,info.interview_time)+'</span><span class="int-edit" onclick="editInterview(\''+lk+'\')">ערוך</span></div>';
        }

        if (isMeeting) {
            const sub = info?.sub_status||null;
            const meetingSubBtns = [
                { val:'sent',    label:'📨 נשלחה הודעה',    cls:'sub-sent'    },
                { val:'no_ans',  label:'🔇 אין מענה',       cls:'sub-no-ans'  },
                { val:'cancel',  label:'❌ ביטל/ה',         cls:'sub-call'    },
                { val:'confirm', label:'✅ אישר/ה הגעה',    cls:'sub-replied' },
                { val:'later',   label:'⏰ דחה/תה תאריך',   cls:'sub-later'   },
                { val:'arrived', label:'🎉 הגיע/ה לריאיון', cls:'sub-hired'   },
            ].map(b => {
                const isActive = sub === b.val ? ' active-sub' : '';
                return '<div class="sub-btn '+b.cls+isActive+'" onclick="setSubStatus(\''+lk+'\',\''+b.val+'\')">'+b.label+'</div>';
            }).join('');
            html += '<div class="sub-status-section"><div class="sub-status-label">סטטוס ריאיון</div><div class="sub-status-grid">'+meetingSubBtns+'</div></div>';
        }

        if (isNotRelevant) {
            html += '<div class="not-relevant-badge"><span>❌ לא רלוונטי</span><div class="nr-actions"><button class="nr-hide-btn" onclick="hideLead(\''+lk+'\')">הסתר</button><span class="nr-undo" onclick="resetLead(\''+lk+'\')">בטל</span></div></div>';
        }

        if (handledBy && !isNotRelevant) html += '<div class="reset-link" onclick="resetLead(\''+lk+'\')">איפוס</div>';
        html += '</div>';
        return html;
    }

    function renderCards() {
        const search = document.getElementById('searchBox').value.toLowerCase();
        const isNotRelFilter = currentFilter==='not_relevant';

        let filtered = allLeads.filter(lead => {
            const lk = (lead.name+'_'+lead.phone).replace(/\s/g,'_');
            const info = leadStatuses[lk];
            const status = info?.status||'new';
            const hidden = info?.hidden||false;

            if (isNotRelFilter) return status==='not_relevant';
            if (hidden) return false;
            if (currentFilter==='new') { if (info&&(info.handled_by||status!=='new')) return false; }
            else if (currentFilter==='meeting') { if (status!=='meeting') return false; }
            else if (currentFilter!=='all') {
                const j = lead.job.toLowerCase();
                if (currentFilter==='מלצר') { if (!j.includes('מלצר')&&!j.includes('שירות')) return false; }
                else if (!j.includes(currentFilter)) return false;
            }
            if (search) { if (!(lead.name+' '+lead.phone+' '+lead.job).toLowerCase().includes(search)) return false; }
            return true;
        });

        if (filtered.length===0) { document.getElementById('leadsArea').innerHTML='<div class="leads-list"><div class="empty-state">לא נמצאו לידים</div></div>'; return; }

        if (!isNotRelFilter) {
            filtered.sort((a,b) => {
                const ia=leadStatuses[(a.name+'_'+a.phone).replace(/\s/g,'_')];
                const ib=leadStatuses[(b.name+'_'+b.phone).replace(/\s/g,'_')];
                const sa=getLeadSort(ia), sb=getLeadSort(ib);
                if (sa!==sb) return sa-sb;
                try { return new Date(b.date)-new Date(a.date); } catch { return 0; }
            });
        }

        const sectionLabels = {0:'🆕 חדשים',1:'📅 נקבע ריאיון',2:'בטיפול',3:'❌ לא רלוונטי'};
        let html = '<div class="leads-list">';
        let lastSection = null;

        filtered.forEach(lead => {
            const lk = (lead.name+'_'+lead.phone).replace(/\s/g,'_');
            const info = leadStatuses[lk];
            const section = isNotRelFilter ? 3 : getLeadSort(info);
            if (!isNotRelFilter && section!==lastSection) {
                if (lastSection!==null) html += '</div>';
                html += '</div><div class="section-label">'+sectionLabels[section]+'</div><div class="leads-list">';
                lastSection = section;
            }
            html += buildCard(lead);
        });

        html += '</div>';
        document.getElementById('leadsArea').innerHTML = html;
    }

    async function init() {
        await loadStatuses();
        loadData();
    }
    init();
    setInterval(async function() { await loadStatuses(); loadData(); }, 2*60*1000);
</script>
